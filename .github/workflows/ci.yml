name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Keep a main release together across all jobs. New pushes queue rather than kill publication.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run release:pack
      - run: npm run build:pages
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      version: ${{ steps.prepare.outputs.version }}
      ready: ${{ steps.push.outputs.ready }}
      pages_artifact: ${{ steps.pages.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare version and README commit
        id: prepare
        run: python -B scripts/cloud-release.py prepare
      - if: steps.prepare.outputs.active == 'true'
        run: npm ci
      - if: steps.prepare.outputs.active == 'true'
        run: npm test
      - if: steps.prepare.outputs.active == 'true'
        run: npm run check
      - if: steps.prepare.outputs.active == 'true'
        run: npm run release:pack
      - if: steps.prepare.outputs.active == 'true'
        run: npm run build:pages
      - name: Push verified version commit
        id: push
        if: steps.prepare.outputs.active == 'true'
        run: python -B scripts/cloud-release.py push
      - uses: actions/upload-artifact@v4
        if: steps.push.outputs.ready == 'true'
        with:
          name: player-package
          path: release/*
          if-no-files-found: error
          overwrite: true
      - name: Configure Pages
        if: steps.push.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Select Pages artifact for this attempt
        id: pages
        if: steps.push.outputs.ready == 'true'
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages
        if: steps.push.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
          name: ${{ steps.pages.outputs.name }}
  deploy:
    needs: release
    if: needs.release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - name: Reject superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/cloud-release.py assert-main
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.release.outputs.pages_artifact }}
  publish:
    needs: [release, deploy]
    if: needs.release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: player-package
          path: release
      - name: Publish lightweight package and verify all channels
        run: python -B scripts/cloud-release.py publish
